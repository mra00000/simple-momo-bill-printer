<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="https://www.momo.vn/favicon.ico" />
    <title>In hoá đơn MoMo</title>
    <style>
      :root {
        --bg: #f4f2f5;
        --surface: #ffffff;
        --text: #1d1a20;
        --muted: #6f6875;
        --border: #e2dde6;
        --accent: #a50064; /* MoMo pink */
        --accent-hover: #8a0054;
        --accent-soft: #fbe7f2;
        --danger: #c62828;
        --radius: 12px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 4px 16px rgba(0, 0, 0, 0.06);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141216;
          --surface: #1e1b21;
          --text: #f1edf3;
          --muted: #a39aa9;
          --border: #34303a;
          --accent: #e0338f;
          --accent-hover: #f0529f;
          --accent-soft: #3a1a2c;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.3);
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      /* ---------- Toolbar ---------- */
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 24px;
        background: color-mix(in srgb, var(--surface) 85%, transparent);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
        font-size: 16px;
        margin-right: auto;
      }
      .brand-logo {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
      }
      .stats {
        color: var(--muted);
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 14px;
        font-weight: 550;
        padding: 8px 16px;
        border-radius: 8px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      }
      .btn:hover:not(:disabled) {
        border-color: var(--muted);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .btn svg {
        width: 16px;
        height: 16px;
      }

      /* ---------- Layout ---------- */
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      /* ---------- Drop zone ---------- */
      .dropzone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 40px 24px;
        border: 2px dashed var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      .dropzone:hover,
      .dropzone:focus-visible {
        border-color: var(--accent);
        outline: none;
      }
      .dropzone.compact {
        flex-direction: row;
        padding: 16px 24px;
        gap: 12px;
      }
      .dropzone.compact .dz-hint {
        display: none;
      }
      .dz-icon {
        width: 44px;
        height: 44px;
        color: var(--accent);
      }
      .dropzone.compact .dz-icon {
        width: 24px;
        height: 24px;
      }
      .dz-title {
        font-weight: 600;
        font-size: 16px;
      }
      .dz-title u {
        color: var(--accent);
        text-decoration: none;
      }
      .dz-hint {
        color: var(--muted);
        font-size: 14px;
      }
      kbd {
        font-family: inherit;
        font-size: 12px;
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 4px;
      }

      /* Full-window overlay while dragging files over the page */
      .drag-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--accent) 14%, transparent);
        backdrop-filter: blur(2px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s;
      }
      .drag-overlay > div {
        padding: 28px 40px;
        border: 3px dashed var(--accent);
        border-radius: 16px;
        background: var(--surface);
        font-size: 18px;
        font-weight: 600;
        color: var(--accent);
        box-shadow: var(--shadow);
      }
      body.dragging .drag-overlay {
        opacity: 1;
      }

      /* ---------- Section heading ---------- */
      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .section-head h2 {
        font-size: 14px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 0;
      }

      /* ---------- Pages (screen preview) ---------- */
      #pages {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .page-wrap {
        position: relative;
      }
      .page-label {
        position: absolute;
        top: -10px;
        left: 16px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        background: var(--bg);
        border-radius: 4px;
      }
      .page {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: space-between;
        overflow: hidden;
        background: #fff;
        width: 100%;
        aspect-ratio: 297 / 210; /* A4 landscape */
        border-radius: 4px;
        box-shadow: var(--shadow);
      }
      .slot {
        position: relative;
        flex: 0 0 calc(100% / 3);
        min-width: 0;
        height: 100%;
      }
      .slot img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .slot-remove {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s, background 0.15s;
      }
      .slot:hover .slot-remove,
      .slot-remove:focus-visible {
        opacity: 1;
      }
      .slot-remove:hover {
        background: var(--danger);
      }
      .slot-index {
        position: absolute;
        bottom: 8px;
        left: 8px;
        min-width: 22px;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .slot:hover .slot-index {
        opacity: 1;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        padding: 8px 0 24px;
      }

      [hidden] {
        display: none !important;
      }

      /* ---------- Print ---------- */
      @media print {
        @page {
          margin: 0;
        }
        html,
        body {
          width: 100%;
          height: 100%;
          background: #fff;
        }
        .toolbar,
        .dropzone,
        .drag-overlay,
        .section-head,
        .page-label,
        .slot-remove,
        .slot-index,
        .empty {
          display: none !important;
        }
        main {
          max-width: none;
          padding: 0;
          margin: 0;
          display: block;
        }
        #pages {
          display: block;
        }
        .page {
          width: 297mm;
          height: 210mm;
          aspect-ratio: auto;
          margin: 0;
          border-radius: 0;
          box-shadow: none;
          break-inside: avoid;
          page-break-inside: avoid;
          /* Landscape grid printed on a portrait A4 sheet */
          transform: rotate(90deg) translate(43mm, 43mm);
        }
        .page-wrap {
          break-after: page;
          page-break-after: always;
        }
        .page-wrap:last-child {
          break-after: auto;
          page-break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">
        <span class="brand-logo">mo</span>
        In hoá đơn
      </div>
      <span class="stats" id="stats"></span>
      <button class="btn" id="clear-btn" type="button" disabled>Xoá tất cả</button>
      <button class="btn btn-primary" id="print-btn" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9V2h12v7" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect x="6" y="14" width="12" height="8" />
        </svg>
        In
      </button>
    </header>

    <main>
      <label class="dropzone" id="dropzone" tabindex="0">
        <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="17 8 12 3 7 8" /><line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        <span class="dz-title">Kéo thả ảnh vào đây hoặc <u>chọn ảnh</u></span>
        <span class="dz-hint">Mỗi trang A4 chứa 3 ảnh · Có thể dán ảnh bằng <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>V</kbd></span>
        <input id="files-input" type="file" accept="image/*" multiple hidden />
      </label>

      <section>
        <div class="section-head" id="pages-head" hidden>
          <h2>Xem trước</h2>
        </div>
        <div id="pages"></div>
        <p class="empty" id="empty">Chưa có ảnh nào.</p>
      </section>
    </main>

    <div class="drag-overlay" aria-hidden="true"><div>Thả ảnh để thêm vào trang in</div></div>

    <script>
      const PER_PAGE = 3;
      const images = []; // { url, name }

      const $ = (id) => document.getElementById(id);
      const input = $("files-input");
      const pagesEl = $("pages");
      const dropzone = $("dropzone");

      function addFiles(fileList) {
        const files = Array.from(fileList).filter((f) => f.type.startsWith("image/"));
        if (!files.length) return;
        // Keep a stable order when several files are dropped at once
        files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        for (const file of files) {
          images.push({ url: URL.createObjectURL(file), name: file.name });
        }
        render();
      }

      function removeAt(index) {
        const [img] = images.splice(index, 1);
        if (img) URL.revokeObjectURL(img.url);
        render();
      }

      function clearAll() {
        images.forEach((img) => URL.revokeObjectURL(img.url));
        images.length = 0;
        render();
      }

      function render() {
        pagesEl.replaceChildren();
        let page = null;

        images.forEach((img, i) => {
          if (i % PER_PAGE === 0) {
            const wrap = document.createElement("div");
            wrap.className = "page-wrap";
            const label = document.createElement("span");
            label.className = "page-label";
            label.textContent = `Trang ${i / PER_PAGE + 1}`;
            page = document.createElement("div");
            page.className = "page";
            wrap.append(label, page);
            pagesEl.appendChild(wrap);
          }

          const slot = document.createElement("div");
          slot.className = "slot";

          const el = document.createElement("img");
          el.src = img.url;
          el.alt = img.name;
          el.title = img.name;

          const idx = document.createElement("span");
          idx.className = "slot-index";
          idx.textContent = i + 1;

          const rm = document.createElement("button");
          rm.className = "slot-remove";
          rm.type = "button";
          rm.title = "Xoá ảnh này";
          rm.setAttribute("aria-label", `Xoá ${img.name}`);
          rm.textContent = "×";
          rm.addEventListener("click", () => removeAt(i));

          slot.append(el, idx, rm);
          page.appendChild(slot);
        });

        const count = images.length;
        const pages = Math.ceil(count / PER_PAGE);
        $("stats").textContent = count ? `${count} ảnh · ${pages} trang` : "";
        $("print-btn").disabled = !count;
        $("clear-btn").disabled = !count;
        $("empty").hidden = !!count;
        $("pages-head").hidden = !count;
        dropzone.classList.toggle("compact", !!count);
      }

      // ---------- File picker ----------
      input.addEventListener("change", (e) => {
        addFiles(e.target.files);
        input.value = ""; // allow re-selecting the same files
      });
      dropzone.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          input.click();
        }
      });

      // ---------- Drag & drop from Finder / Explorer ----------
      const hasFiles = (e) => Array.from(e.dataTransfer?.types || []).includes("Files");
      let dragDepth = 0;

      window.addEventListener("dragenter", (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault();
        dragDepth++;
        document.body.classList.add("dragging");
      });
      window.addEventListener("dragover", (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault(); // required so the browser allows dropping
        e.dataTransfer.dropEffect = "copy";
      });
      window.addEventListener("dragleave", (e) => {
        if (!hasFiles(e)) return;
        dragDepth = Math.max(0, dragDepth - 1);
        if (dragDepth === 0) document.body.classList.remove("dragging");
      });
      window.addEventListener("drop", (e) => {
        if (!hasFiles(e)) return;
        e.preventDefault(); // stop the browser from opening the image
        dragDepth = 0;
        document.body.classList.remove("dragging");
        addFiles(e.dataTransfer.files);
      });

      // ---------- Paste from clipboard ----------
      window.addEventListener("paste", (e) => {
        const files = Array.from(e.clipboardData?.items || [])
          .filter((it) => it.kind === "file")
          .map((it) => it.getAsFile())
          .filter(Boolean);
        if (files.length) {
          e.preventDefault();
          addFiles(files);
        }
      });

      // ---------- Actions ----------
      $("print-btn").addEventListener("click", () => window.print());
      $("clear-btn").addEventListener("click", clearAll);

      render();
    </script>
  </body>
</html>
